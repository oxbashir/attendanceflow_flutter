name: attendance_flow
description: "A new Flutter project."
publish_to: 'none'
version: 1.3.0+15

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.3
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.3
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  in_app_update: ^5.0.0
  url_launcher: ^6.3.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/launcher_icon.png"
  adaptive_icon_background: "#6122D5"
  adaptive_icon_foreground: "assets/icon/launcher_icon.png"
  adaptive_icon_foreground_inset: 18
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/launcher_icon.png"
    background_color: "#6122D5"
    theme_color: "#4F7EFF"
  windows:
    generate: true
    image_path: "assets/icon/launcher_icon.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

  # fonts:
  #   - family: Schyler
